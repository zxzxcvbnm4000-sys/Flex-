<body><div><h1>404</h1><p>الصفحة التي تبحث عنها غير موجودة.</p>
<a id="home" href="/">العودة إلى FLEX</a></div>
<script>
/* يحدد الجذر الصحيح سواء كان الموقع على نطاق مخصص أو على github.io/اسم-المستودع */

document.getElementById("home").href=/\.github\.io$/.test(host)&&p.length?"/"+p[0]+"/":"/";
</script></body></html>
